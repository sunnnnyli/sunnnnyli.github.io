    <script>
        // Same theme choice as the portfolio (shared on the same site)
        (() => {
            let t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = t;
        })();
    </script>

        /* Light: Slate & coral (also the no-script default) */
        :root,
        :root[data-theme="light"] {
            --bg: #f2f4f6;
            --bg-rgb: 242, 244, 246;
            --bg-alt: #e8ebef;
            --surface: #fafbfc;
            --line: #d4d9df;
            --text: #242a31;
            --text-2: #59616c;
            --text-3: #5d6570;
            --ink-rgb: 36, 42, 49;
            --accent: #a84a33;
            --accent-rgb: 168, 74, 51;

            --emph-bg: #242a31;

            --ring-3: #8b95a3;

        }

        /* Dark: Graphite & honey */
        :root[data-theme="dark"] {
            --bg: #1c1c1d;
            --bg-rgb: 28, 28, 29;
            --bg-alt: #232325;
            --surface: #29292c;
            --line: #38373a;

        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --bg: #1c1c1d;
                --bg-rgb: 28, 28, 29;

        * { box-sizing: border-box; }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 1.5rem 1rem;
            background:
                radial-gradient(60% 50% at 80% 10%, rgba(var(--accent-rgb), 0.12), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: "Newsreader", Georgia, serif;
        }

        main { width: min(36rem, 100%); }

        .code {
            margin: 0 0 1rem;
            font: 500 0.8rem/1 "Instrument Sans", system-ui, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 8vw, 4.2rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        h1 em { color: var(--accent); }

        p.lede {
            margin: 1.1rem 0 2rem;
            font-size: clamp(1.1rem, 2.2vw, 1.3rem);
            line-height: 1.5;
            color: var(--text-2);
        }

        a.home {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 1.4rem;
            border-radius: 980px;
            background: var(--text);
            color: var(--bg);
            font: 500 1rem "Instrument Sans", system-ui, sans-serif;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }

        a.home:hover { background: var(--accent); color: var(--accent-ink); }

        a.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>This page <em>wandered off.</em></h1>
        <p class="lede">The link might be mistyped, or the page may have moved. Everything I've built is one click away.</p>
        <a class="home" href="/">Back to the portfolio <span aria-hidden="true">→</span></a>
